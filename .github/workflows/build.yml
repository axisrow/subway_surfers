name: Build apps

# Builds the Android APK and the macOS DMG.
# - Pull requests / pushes: files are attached to the workflow run (Artifacts).
# - Pushes to master, v* tags and manual runs also publish a GitHub Release.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Copy the game into the Android project
        run: npm run android:sync

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Subway-Surfers-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Subway-Surfers-android
          path: Subway-Surfers-android.apk
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest  # Apple Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npm run mac:dmg
        env:
          # No Apple Developer certificate: the app is ad-hoc signed
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Smoke test the packaged app
        timeout-minutes: 3
        run: SMOKE_TEST=1 "dist/mac-arm64/Subway Surfers.app/Contents/MacOS/Subway Surfers"

      - uses: actions/upload-artifact@v4
        with:
          name: Subway-Surfers-macOS
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, macos]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body: |
            **macOS (Apple Silicon):** download the `.dmg`, drag the app to Applications, then run once in Terminal:
            `xattr -cr "/Applications/Subway Surfers.app"` (the app is not signed with an Apple Developer ID).

            **Android:** download the `.apk` on the phone and install it (allow installing from unknown sources).
